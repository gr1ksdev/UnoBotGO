# PostgreSQL local para o UnoBotGO v3.
#
#   docker compose up -d        # sobe o banco
#   docker compose logs -f db   # acompanha a inicialização
#   docker compose down         # para (os dados permanecem no volume)
#   docker compose down -v      # para e APAGA os dados
#
# Os valores abaixo batem com o .env.example. Se você alterou o DATABASE_URL
# no seu .env, ajuste POSTGRES_USER/PASSWORD/DB aqui também.

services:
  db:
    image: postgres:17-alpine
    container_name: unobotgo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: unobot
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: unobot
      # Evita avisos de locale e mantém os timestamps consistentes com o ranking.
      LANG: C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria o banco usado pelos testes de integração (TEST_DATABASE_URL).
      - ./docker/init/01-create-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unobot -d unobot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
    name: unobotgo-pgdata
