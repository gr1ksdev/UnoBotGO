services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: unobot
      POSTGRES_PASSWORD: unobot
      POSTGRES_DB: unobot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unobot -d unobot"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.v2
    ports:
      - "8080:8080"
    environment:
      TOKEN: ${TOKEN}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
      TURN_TIMEOUT: ${TURN_TIMEOUT:-2m}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      DATABASE_URL: postgres://unobot:unobot@db:5432/unobot?sslmode=disable
      WEB_ADDR: :8080
      MINIAPP_SECRET: ${MINIAPP_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
