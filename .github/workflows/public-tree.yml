name: public-tree

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  forbidden-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject private workflow and V1 paths
        shell: bash
        run: |
          set -euo pipefail
          forbidden='^(\.agent/|\.opencode/|\.reports/|AGENTS\.md$|codemaps/|docker-compose\.yml$|Dockerfile$|docs/v2-audit\.md$|main\.go$|game\.go$|gamemanager\.go$|ranking\.go$|match\.go$|inline\.go$|commands\.go$|actions\.go$|player\.go$|deck\.go$|card\.go$|results\.go$|errors\.go$|cmd_)'
          if git ls-files | grep -E "$forbidden"; then
            echo 'forbidden private or V1 path found in public main'
            exit 1
          fi
